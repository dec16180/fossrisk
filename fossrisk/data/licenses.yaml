  AGPL-1.0-only: {category: network-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license, network-disclosure]}
  AGPL-1.0-or-later: {category: network-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license, network-disclosure]}
  OSL-2.0: {category: network-copyleft, obligations: [attribution, include-license-text, disclose-source, same-license, network-disclosure]}
  OSL-2.1: {category: network-copyleft, obligations: [attribution, include-license-text, disclose-source, same-license, network-disclosure]}
  AGPL-3.0-only: {category: network-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license, network-disclosure]}
  AGPL-3.0-or-later: {category: network-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license, network-disclosure]}
  OSL-3.0: {category: network-copyleft, obligations: [attribution, include-license-text, disclose-source, same-license, network-disclosure]}
  RPL-1.5: {category: network-copyleft, obligations: [attribution, include-license-text, disclose-source, same-license, network-disclosure]}
  SSPL-1.0: {category: network-copyleft, obligations: [attribution, include-license-text, disclose-source, same-license, network-disclosure]}
  # --- non-commercial or otherwise use-restricted ---
