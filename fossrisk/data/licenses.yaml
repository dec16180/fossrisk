  CC-BY-NC-ND-4.0: {category: non-commercial, obligations: [attribution]}
  CC-BY-ND-4.0: {category: non-commercial, obligations: [attribution]}
  PolyForm-Noncommercial-1.0.0: {category: non-commercial, obligations: [include-license-text]}
  BUSL-1.1: {category: non-commercial, obligations: [include-license-text]}
  Elastic-2.0: {category: non-commercial, obligations: [include-license-text]}
  # --- proprietary ---
  LicenseRef-Proprietary: {category: proprietary, obligations: []}

# License exceptions (the part after WITH). The category replaces the base
# license's category only when the base license is copyleft.
exceptions:
  Classpath-exception-2.0: {category: weak-copyleft}
  OpenJDK-assembly-exception-1.0: {category: weak-copyleft}
  GCC-exception-3.1: {category: weak-copyleft}
  LGPL-3.0-linking-exception: {category: weak-copyleft}
  Qt-LGPL-exception-1.1: {category: weak-copyleft}
  Universal-FOSS-exception-1.0: {category: weak-copyleft}
  WxWindows-exception-3.1: {category: weak-copyleft}
  LLVM-exception: {category: permissive}
  Autoconf-exception-2.0: {category: permissive}
  Autoconf-exception-3.0: {category: permissive}
  Bison-exception-2.2: {category: permissive}
  Font-exception-2.0: {category: permissive}

# Free-text license names seen in real SBOMs -> SPDX id. Matching ignores
# case and repeated whitespace. Bare "BSD" is deliberately absent (ambiguous).
aliases:
  "Apache 2": Apache-2.0
  "Apache 2.0": Apache-2.0
  "Apache-2": Apache-2.0
  "Apache2": Apache-2.0
  "Apache License 2.0": Apache-2.0
