# Bundled license knowledge base. Categories and obligations are a
# compliance-triage aid, not legal advice. Keys are SPDX identifiers.
licenses:
  # --- public domain / no conditions ---
  CC0-1.0: {category: public-domain, obligations: []}
  Unlicense: {category: public-domain, obligations: []}
  LicenseRef-Public-Domain: {category: public-domain, obligations: []}
  # --- permissive ---
  0BSD: {category: permissive, obligations: []}
  MIT-0: {category: permissive, obligations: []}
  WTFPL: {category: permissive, obligations: []}
  MIT: {category: permissive, obligations: [attribution, include-license-text]}
  X11: {category: permissive, obligations: [attribution, include-license-text]}
  ISC: {category: permissive, obligations: [attribution, include-license-text]}
  BSD-2-Clause: {category: permissive, obligations: [attribution, include-license-text]}
  BSD-3-Clause: {category: permissive, obligations: [attribution, include-license-text]}
  BSD-4-Clause: {category: permissive, obligations: [attribution, include-license-text]}
  Apache-2.0: {category: permissive, obligations: [attribution, include-license-text, notice-file, state-changes]}
  BSL-1.0: {category: permissive, obligations: [include-license-text]}
  Zlib: {category: permissive, obligations: [include-license-text, state-changes]}
  PSF-2.0: {category: permissive, obligations: [attribution, include-license-text, state-changes]}
  Python-2.0: {category: permissive, obligations: [attribution, include-license-text, state-changes]}
  Unicode-DFS-2016: {category: permissive, obligations: [attribution, include-license-text]}
  Unicode-3.0: {category: permissive, obligations: [attribution, include-license-text]}
  BlueOak-1.0.0: {category: permissive, obligations: [include-license-text]}
  ZPL-2.1: {category: permissive, obligations: [attribution, include-license-text]}
  Artistic-2.0: {category: permissive, obligations: [attribution, include-license-text, state-changes]}
  bzip2-1.0.6: {category: permissive, obligations: [attribution, include-license-text]}
  curl: {category: permissive, obligations: [attribution, include-license-text]}
  CC-BY-3.0: {category: permissive, obligations: [attribution, state-changes]}
  CC-BY-4.0: {category: permissive, obligations: [attribution, state-changes]}
  # --- weak copyleft ---
  LGPL-2.0-only: {category: weak-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license]}
  LGPL-2.0-or-later: {category: weak-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license]}
