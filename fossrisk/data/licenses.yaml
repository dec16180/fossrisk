  LGPL-3.0-only: {category: weak-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license]}
  LGPL-3.0-or-later: {category: weak-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license]}
  MPL-1.1: {category: weak-copyleft, obligations: [attribution, include-license-text, disclose-source, same-license]}
  MPL-2.0: {category: weak-copyleft, obligations: [attribution, include-license-text, disclose-source, same-license]}
  EPL-1.0: {category: weak-copyleft, obligations: [attribution, include-license-text, disclose-source, same-license]}
  EPL-2.0: {category: weak-copyleft, obligations: [attribution, include-license-text, disclose-source, same-license]}
  CDDL-1.0: {category: weak-copyleft, obligations: [attribution, include-license-text, disclose-source, same-license]}
