  CPL-1.0: {category: weak-copyleft, obligations: [attribution, include-license-text, disclose-source, same-license]}
  MS-RL: {category: weak-copyleft, obligations: [attribution, include-license-text, disclose-source, same-license]}
  OFL-1.1: {category: weak-copyleft, obligations: [include-license-text, same-license]}
  # --- strong copyleft ---
  GPL-1.0-only: {category: strong-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license]}
  GPL-1.0-or-later: {category: strong-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license]}
  EUPL-1.0: {category: strong-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license]}
  CC-BY-SA-2.0: {category: strong-copyleft, obligations: [attribution, state-changes, same-license]}
  GPL-2.0-only: {category: strong-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license]}
  GPL-2.0-or-later: {category: strong-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license]}
  GPL-3.0-only: {category: strong-copyleft, obligations: [attribution, include-license-text, state-changes, disclose-source, same-license]}
